name: deploy website
on:
  push:
    branches:   #condition1=only trigger on main branch
      - main
    paths:      #condition2=this file should be modified
      - 'index.html'

permissions:    #give the permitions to github actions to read and write the content of the repository
  contents: read   
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: setup github page
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4